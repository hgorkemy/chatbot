<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Görkem Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="title-area">
          <h1 id="page-title">Halil Görkem Yiğit Informational Chatbot</h1>
          <p id="page-subtitle">
            Ask about education, projects, experience, and career goals.
          </p>
        </div>

        <button id="lang-toggle" class="lang-btn" aria-label="Toggle language">
  Türkçe sohbet için basın
</button>
      </div>

      <div id="chat-window" class="chat-window"></div>

      <div id="suggestions" class="suggestions"></div>

      <form id="chat-form" class="chat-form">
        <input
          id="user-input"
          type="text"
          placeholder="Ask something about Görkem..."
          autocomplete="off"
        />
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>

    <script src="data.js"></script>
    <script src="bot.js"></script>
  </body>
</html>
